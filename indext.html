<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덕장중 3학년 한국사 몸풀기 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1>📜 한국사 몸풀기 퀴즈</h1>
        <div id="quiz">
            <h2 id="question">문제가 여기에 표시됩니다.</h2>
            <div id="options" class="options-container">
                </div>
        </div>
        <div id="result" class="hidden">
            <h2 id="score"></h2>
            <button id="retry-btn" onclick="startQuiz()">다시 풀기</button>
        </div>
        <div class="progress">
            <span id="progress-text">1 / 3</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
